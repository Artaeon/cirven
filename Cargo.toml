[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Artaeon/cirven"
homepage = "https://cirven.dev"

[workspace.dependencies]
cirven-core = { path = "crates/cirven-core" }
cirven-audit = { path = "crates/cirven-audit" }
cirven-harden = { path = "crates/cirven-harden" }
cirven-watch = { path = "crates/cirven-watch" }
cirven-lure = { path = "crates/cirven-lure" }
cirven-pkg = { path = "crates/cirven-pkg" }
cirven-cage = { path = "crates/cirven-cage" }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
